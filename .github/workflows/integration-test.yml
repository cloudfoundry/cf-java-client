name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      java-versions:
        description: 'JSON array of Java versions to test'
        type: string
        required: false
        default: '[17, 21]'
      preview:
        description: 'Deploy the latest cf-deployment versions and capi chart instead of the default ones (v3 job only)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_call:
    inputs:
      java-versions:
        description: 'JSON array of Java versions to test'
        type: string
        required: false
        default: '[17, 21]'
      preview:
        description: 'Deploy the latest cf-deployment versions and capi chart instead of the default ones (v3 job only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A new push supersedes the running test. The group name differs from the caller's workflow name on
# purpose: a called workflow shares github.workflow with its caller, which would cancel the caller.
concurrency:
  group: integration-test-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

env:
  CF_API_HOST: api.cf.127-0-0-1.nip.io
  CF_UAA_HOST: uaa.cf.127-0-0-1.nip.io

jobs:
  integration-test:
    if: ${{ github.event_name != 'schedule' || github.repository == 'cloudfoundry/cf-java-client' }}
    runs-on: ubuntu-latest
    # The v2 job runs about three quarters of the tests and takes about 1h40m.
    timeout-minutes: ${{ matrix.api == 'v2' && 150 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java-versions || (github.event_name == 'schedule' && '[21]' || '[17, 21]')) }}
        api: [v2, v3]
        include:
          # Newer CAPI releases disable the CC v2 API, so the v2 tests (@RequiresV2Api, JUnit tag
          # "v2") run against a dedicated, pinned CAPI. The capi chart 1.249.0 is the last one that
          # serves v2: from 1.249.1-1 on, v2 is behind cloudController.config.temporaryEnableV2,
          # which kind-deployment v0.26.0 doesn't set. Newer kind-deployment versions don't deploy
          # these older charts any more (their capi values schema changed with 1.249.1-1).
          # Keep capi-version in sync with SUPPORTED_API_VERSION (2.299.0) in CloudFoundryClient.java.
          - api: v2
            kind-deployment-ref: b42a88a35756595bd4108d2b525ded5b014a9515 # v0.26.0
            capi-version: 1.249.0
            test-selection: -Dgroups=v2
            skip-v2-tests: 'false'
          # All other tests run with v2 disabled, against the capi chart of SUPPORTED_API_VERSION_V3
          # (3.237.0, capi-release 1.252.0), so that a new capi chart can't break validation runs.
          # Preview runs deploy the latest capi chart instead.
          # Keep capi-version in sync with SUPPORTED_API_VERSION_V3 in CloudFoundryClient.java.
          - api: v3
            kind-deployment-ref: 6b6882c54a23bfd23982299052ae681f481ad231 # main, 2026-11-13
            capi-version: 1.252.1-1
            test-selection: -DexcludedGroups=v2
            skip-v2-tests: 'true'
    name: Java ${{ matrix.java }} ${{ matrix.api }} integration test${{ matrix.api == 'v3' && (inputs.preview || github.event_name == 'schedule') && ' (preview)' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Resolve CAPI version
        id: capi
        env:
          CAPI_VERSION: ${{ matrix.capi-version }}
          # The v2 job stays on its pinned version, preview runs only affect the v3 job
          USE_LATEST_CAPI: ${{ matrix.api == 'v3' && (inputs.preview || github.event_name == 'schedule') }}
        run: |
          if [ "$USE_LATEST_CAPI" = true ]; then
            # separate assignment, so that a failing resolver fails the step
            CAPI_VERSION="$(.github/scripts/resolve-latest-capi-chart.sh)"
          fi
          echo "version=$CAPI_VERSION" >> "$GITHUB_OUTPUT"
      # All components share one Postgres, which runs out of its default 100 connections during a full
      # test run.
      # The capi chart version overrides the one of kind-deployment (merged last by Helmfile), also in
      # preview runs.
      - name: Write values override
        env:
          CAPI_VERSION: ${{ steps.capi.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/cf-values.yaml" <<EOF
          postgresql:
            primary:
              extendedConfiguration: |
                max_connections = 500
          charts:
            capi:
              version: $CAPI_VERSION
          EOF
      # Every job gets its own Cloud Foundry on KinD, so the matrix can run in parallel.
      # The action of kind-deployment main also deploys v0.26.0 (ref), but unlike the v0.26.0 one, it
      # masks the generated admin credentials, which the step logs show otherwise.
      - name: Set up Cloud Foundry
        uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@6b6882c54a23bfd23982299052ae681f481ad231 # main, 2026-11-13
        with:
          ref: ${{ matrix.kind-deployment-ref }}
          # The v2 job stays on its pinned versions, preview runs only affect the v3 job
          use-latest-versions: ${{ matrix.api == 'v3' && (inputs.preview || github.event_name == 'schedule') }}
          github-token: ${{ github.token }}
          additional-values-files: ${{ runner.temp }}/cf-values.yaml
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run integration tests
        # CC_ADMIN_PASSWORD and UAA_ADMIN_SECRET are exported by setup-cf
        env:
          TEST_APIHOST: ${{ env.CF_API_HOST }}
          TEST_ADMIN_USERNAME: ccadmin
          TEST_ADMIN_PASSWORD: ${{ env.CC_ADMIN_PASSWORD }}
          TEST_ADMIN_CLIENTID: admin
          TEST_ADMIN_CLIENTSECRET: ${{ env.UAA_ADMIN_SECRET }}
          TEST_SKIPSSLVALIDATION: 'true'
          TEST_QUOTAS_ROUTES_RESERVED_PORTS: '50'
          SKIP_V2_TESTS: ${{ matrix.skip-v2-tests }}
          # kind-deployment has no metric registrar, which the log-cache metric tests need
          SKIP_METRIC_REGISTRAR_TESTS: 'true'
        run: ./mvnw -B -Pintegration-test test -Dgpg.skip ${{ matrix.test-selection }}
