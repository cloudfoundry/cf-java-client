version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,4" # Mondays and Thursdays at 06:00 UTC
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1,4" # Mondays and Thursdays at 06:00 UTC
    open-pull-requests-limit: 10
